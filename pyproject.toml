[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adlc"
version = "0.1.0"
description = "Agentic Development Lifecycle framework — governed, evidence-producing agentic SDLC for any GitHub repo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
copilot = ["github-copilot-sdk>=0.1"]
governance = ["agent-framework", "agent-governance-toolkit[full]"]
evals = ["assert-ai"]
azure = ["azure-ai-evaluation", "azure-monitor-opentelemetry"]
flags = ["openfeature-sdk>=0.7", "launchdarkly-server-sdk>=9.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
adlc = "adlc.cli:app"

# ---------------------------------------------------------------------------
# Adapter registry.
#
# EVERY adapter -- spine default and leaf alike -- is pre-declared here so that
# no workstream ever has to edit this file. `adlc.config.load_adapters` swallows
# ImportError, so an entry point whose module does not exist yet is simply
# undiscoverable rather than fatal. This is what lets 11 workstreams land in
# parallel without a merge conflict on pyproject.toml.
#
# Each adapter implements a Protocol from `adlc.ports` plus a static detect().
# ---------------------------------------------------------------------------
[project.entry-points."adlc.agents"]
fake = "adlc.adapters.agents.fake:FakeAgentRunner"              # spine default
copilot-sdk = "adlc.adapters.agents.copilot_sdk:CopilotSdkRunner"     # L1
agent-task = "adlc.adapters.agents.agent_task:AgentTaskRunner"        # L1
gh-aw = "adlc.adapters.agents.gh_aw:GhAwRunner"                       # L1
maf = "adlc.adapters.agents.maf_governed:MafGovernedRunner"           # L2

[project.entry-points."adlc.taskstore"]
sqlite = "adlc.adapters.taskstore.sqlite:SqliteTaskStore"       # spine default
github = "adlc.adapters.taskstore.github:GitHubTaskStore"             # L5

[project.entry-points."adlc.evals"]
deterministic = "adlc.adapters.evals.deterministic:DeterministicRubricRunner"  # spine default
assert-ai = "adlc.adapters.evals.assert_:AssertEvalRunner"            # L3
promptfoo = "adlc.adapters.evals.promptfoo:PromptfooEvalRunner"       # L3
azure = "adlc.adapters.evals.azure:AzureEvalRunner"                   # L3

[project.entry-points."adlc.evidence"]
local = "adlc.adapters.evidence.local:LocalEvidenceCollector"          # spine default
playwright = "adlc.adapters.evidence.playwright:PlaywrightCollector"  # spine, when installed
lighthouse = "adlc.adapters.evidence.lighthouse:LighthouseCollector"  # L6
k6 = "adlc.adapters.evidence.k6:K6Collector"                          # L6
axe = "adlc.adapters.evidence.axe:AxeCollector"                       # L6

[project.entry-points."adlc.flags"]
flagd-file = "adlc.adapters.flags.flagd_file:FlagdFileProvider"  # spine default
launchdarkly = "adlc.adapters.flags.launchdarkly:LaunchDarklyProvider"  # L7

[project.entry-points."adlc.telemetry"]
otel-file = "adlc.adapters.telemetry.otel_file:OtelFileTelemetry"  # spine default
appinsights = "adlc.adapters.telemetry.appinsights:AppInsightsTelemetry"  # L10

[project.entry-points."adlc.export"]
oes = "adlc.adapters.export.oes:OesExporter"                          # L7

[project.entry-points."adlc.daytwo"]
sre-agent = "adlc.adapters.daytwo.sre_agent:SreAgentReceiver"         # L10
foundry = "adlc.adapters.daytwo.foundry:FoundryHotfixAgent"           # L10

[project.entry-points."adlc.gate"]
# spine defaults -- credential-free, required in the `minimal` profile
tests = "adlc.adapters.gate.tests:TestsGate"
secrets_local = "adlc.adapters.gate.secrets_local:SecretsLocalGate"
deps_local = "adlc.adapters.gate.deps_local:DepsLocalGate"
evidence_completeness = "adlc.adapters.gate.evidence_completeness:EvidenceCompletenessGate"
# leaves
security = "adlc.adapters.gate.codeql:CodeQlGate"                     # L4
code_quality = "adlc.adapters.gate.code_quality:CodeQualityGate"      # L4
dependency = "adlc.adapters.gate.dependency:DependencyReviewGate"     # L4
evals = "adlc.adapters.gate.evals:EvalsGate"                          # L3
governance = "adlc.adapters.gate.governance:GovernanceGate"           # L2
adversarial_review = "adlc.adapters.gate.adversarial_review:AdversarialReviewGate"  # L8
evidence_review = "adlc.adapters.gate.evidence_review:EvidenceReviewGate"           # L8

[tool.hatch.build.targets.wheel]
packages = ["src/adlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# An explicit select is load-bearing. Without one, ruff falls back to its
# minimal default (E4, E7, E9, F) and reports "All checks passed" across 162
# files while examining very little -- a lint gate that looks green because it
# is barely looking.
select = [
    "F",      # pyflakes: real errors
    "E", "W", # pycodestyle
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear: likely bugs
    "A",      # builtin shadowing
    "C4",     # comprehensions
    "DTZ",    # naive datetimes -- audit records must be unambiguous
    "T20",    # stray print()
    "SIM",    # simplifiable constructs
    "PTH",    # os.path -> pathlib
    "RET",    # return-flow smells
    "ARG",    # unused arguments
    "PL",     # pylint subset
    "PERF",   # obvious performance traps
    "RUF",    # ruff-specific, incl. unused noqa
    "S",      # bandit: security
    "BLE",    # blind except
    "TRY",    # exception antipatterns
    "ANN",    # annotations
    "PGH",    # blanket noqa / type: ignore without a code
    "N",      # naming
]

ignore = [
    # --- deliberate design choices ------------------------------------------
    # typer expresses CLI parameters as call-valued defaults; this is the idiom.
    "B008",
    # Lazy imports are load-bearing: the CLI keeps startup fast, and every
    # optional adapter must be importable-or-not without breaking the spine.
    # Narrowed rather than blanket-ignored would be better; tracked as follow-up.
    "PLC0415",
    # Skipping a file we cannot read or decode is deliberate, not a swallowed bug.
    "S112",
    # A specific message in `raise` is worth more to an operator than brevity.
    "TRY003",
    # Keeping the raising path inline reads better than extracting it here.
    "TRY301",
    # `try/except/else` is not clearer than an early return in these flows.
    "TRY300",
    # This tool's job is driving git, pytest and other CLIs, so subprocess use is
    # inherent. Note S607 is about PATH resolution, not argument provenance: we
    # accept resolving `git`/`gh`/`python` from PATH because pinning absolute
    # paths would break every supported platform and CI image.
    "S603", "S607",

    # --- rules we deliberately do not enforce --------------------------------
    # Em and en dashes are intentional typography in prose and in generated
    # Markdown, and the Jinja templates use them too. Normalising them to ASCII
    # would make Python-generated output disagree with template-generated output.
    "RUF001", "RUF002", "RUF003",
    # PERF401 rewrites guarded append loops into comprehensions. With a
    # condition and a `continue`, the loop form is usually clearer, and 31
    # mechanical rewrites is churn with a real chance of introducing a bug. This
    # is a settled position, not a deferral.
    "PERF401",
    # N818 wants an `Error` suffix on exception names. `GovernanceUnavailable`
    # and `EvalBackendUnavailable` read better as-is and the suffix adds no
    # information. Also a settled position.
    "N818",

    # --- deferred, with the change that will remove them ---------------------
    # ANN401 (`Any` in signatures) is the closest analogue to anti-slop's
    # no-unknown-parameters/no-unknown-returns and is the highest-value rule
    # here. 138 sites in src plus 157 in tests is too many to address in one
    # reviewable change, so it is deferred to the low-evidence work that ADR
    # 0001 describes -- which is also where a ratchet belongs, since a comment
    # enforces nothing. Do not drop this entry silently.
    "ANN401",
    # Line length and complexity thresholds land with the mechanical formatting
    # change; ruff-format does not fix these, so they need their own pass.
    "E501",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# Adapters implement Protocols from `adlc.ports`, and stages share a uniform
# `(cfg, rd)` signature so the CLI can dispatch them identically. A `cfg` that a
# particular implementation ignores is still required by the interface -- it is
# not left over, and renaming it would break the match.
"src/adlc/adapters/**" = ["ARG001", "ARG002", "ARG004"]
"src/adlc/stages/**" = ["ARG001", "ARG002", "ARG004"]
"src/adlc/maf/**" = ["ARG001", "ARG002", "ARG004"]
# `adlc.stages.hotfix` doubles as a standalone entry point; printing is its
# output contract, the same as any CLI main.
"src/adlc/stages/hotfix.py" = ["T201"]
# Tests assert on internals, use magic values, and drive subprocesses.
"tests/**" = [
    "S101",           # assert is the point
    "S105", "S106",   # fixture strings named *token*/*secret* are not credentials
    "S602", "S603", "S607",  # fixtures build repos with git
    "SLF001",         # private access is how we test invariants
    "PLR2004",        # magic values in assertions are clearer inline
    "ANN",            # test signatures are self-evident
    "ARG",            # pytest fixtures arrive as unused-looking arguments
    "PLR0915",        # long, explicit test bodies beat clever ones
    "E402",           # conftests bind sys.path before importing adlc, by design
]
# Diagnostic scripts print by design.
"scripts/**" = ["T20", "ANN", "S603", "S607"]
# Lint tooling prints its findings; that is its output contract.
"tools/**" = ["T20"]
